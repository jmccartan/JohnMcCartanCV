<!DOCTYPE html>

    <style>
        :root { color-scheme: light dark; }

        body {
            margin: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

            font-size: 0.75rem;

        a.btn {
            display: inline-block;

            font-size: 0.95rem;
            font-weight: 500;
            border: 1px solid #2f3642;
            color: #e8eaed;
            transition: background 0.18s ease, border-color 0.18s ease;
        }

        a.btn.primary { background: #e8eaed; color: #0f1115; border-color: #e8eaed; }
        a.btn.primary:hover { background: #ffffff; border-color: #ffffff; }
        @media (prefers-color-scheme: light) {
            body { background: #ffffff; color: #14181f; }
            p { color: #4a5261; }
            .code { color: #6b7383; }
            a.btn { border-color: #d8dde5; color: #14181f; }
            a.btn:hover { background: #f3f5f8; border-color: #b9c1cd; }
